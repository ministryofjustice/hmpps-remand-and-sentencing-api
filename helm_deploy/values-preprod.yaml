---
# Per environment values which override defaults in hmpps-remand-and-sentencing-api/values.yaml

generic-service:

  ingress:
    host: &ingressHost remand-and-sentencing-api-preprod.hmpps.service.justice.gov.uk

  env:
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: applicationinsights.dev.json
    HMPPS_AUTH_URL: https://sign-in-preprod.hmpps.service.justice.gov.uk/auth
    PRISON_API_URL: https://prison-api-preprod.prison.service.justice.gov.uk
    DOCUMENT_MANAGEMENT_API_URL: https://document-api-preprod.hmpps.service.justice.gov.uk
    ADJUSTMENTS_API_URL: "https://adjustments-api-preprod.hmpps.service.justice.gov.uk"
    COURT-REGISTER_API_URL: https://court-register-api-preprod.hmpps.service.justice.gov.uk
    PERSON-RECORD_API_URL: https://hmpps-person-record-preprod.hmpps.service.justice.gov.uk
    PRISON-REGISTER_API_URL: https://prison-register-preprod.hmpps.service.justice.gov.uk
    MANAGE_OFFENCES_API_URL: https://manage-offences-api-preprod.hmpps.service.justice.gov.uk
    PRISONER-SEARCH_API_URL: https://prisoner-search-preprod.prison.service.justice.gov.uk
    INGRESS_URL: *ingressHost
    ENVIRONMENT_NAME: PREPROD
    HMPPS_SAR_ENABLED: "true"
    HMPPS_SAR_TEMPLATE_PATH: /templates/template_remand-and-sentencing-api.mustache
    HMPPS_SAR_TEMPLATE_ENABLED: "true"
    COURT-DATA-INGESTION_API_URL: "https://court-data-ingestion-api-preprod.hmpps.service.justice.gov.uk"
    FEATURES_HMCTS_WARRANT_THING_TO_DO_ENABLED: "true"
    FEATURES_HMCTS_WARRANT_THING_TO_DO_REPEAT_REMAND_HEARING_ENABLED: "false"
    FEATURES_HMCTS_WARRANT_THING_TO_DO_SENTENCING_ENABLED: "true"
    FEATURES_HMCTS_WARRANT_THING_TO_DO_MULTIPLE_NOTIFICATIONS_ENABLED: "false"
    FEATURES_APPEARANCE_SCHEDULES_EVENTS_ENABLED: "true"

  allowlist:
    # Configure groups as appropriate to give the minimum ingress access required:
    #   global_protect: devices using the global_protect proxy
    #   moj_cloud_platform: services on Cloud Platform
    # Other IP allowlist groups are here:
    # https://github.com/ministryofjustice/hmpps-ip-allowlists/blob/main/ip-allowlist-groups.yaml

    groups:
      - global_protect
      - moj_cloud_platform

  # NOTE: Removing ALL allowlist groups will make the application accessible from the internet.
  #       If you are intending to do this, please ensure you uncomment the 'modsecurity_enabled=true'
  #       entry in the ingress above. This will enable WAF protection of the endpoint. You will need
  #       to configure modsecurity rules to suit your needs. Further information can be found here:
  #       https://user-guide.cloud-platform.service.justice.gov.uk/documentation/networking/modsecurity.html#modsecurity-web-application-firewall

  resources:
    requests:
      memory: 2G
    limits:
      memory: 4G

# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  businessHoursOnly: true
  alertSeverity: legacy-replacement-alerts-non-prod

manyChargesToSentenceFixCronjob:
  enabled: true
  schedule: "30 2 * * 1-5" # 2:30am mon-fri